<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="利安貿易有限公司最新消息：網站公告、產品動態與重要通知。">
  <title>最新消息 - 利安貿易有限公司 LY AN TRADE CO.,LTD.</title>

  <style>
    /* =============================================
       CSS 自訂變數
    ============================================= */
    :root {
      --color-primary:    #713917;
      --color-primary-dk: #4e2610;
      --color-gold:       #b8860b;
      --color-text:       #333333;
      --color-text-light: #666666;
      --color-white:      #ffffff;
      --color-bg-nav:     #f5ede3;
      --color-bg-news:    #fdf8f3;

      --font-base: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", Arial, sans-serif;

      --nav-w: 200px;
      --max-w: 900px;
      --gap:   1.25rem;
    }

    /* =============================================
       Reset & Base
    ============================================= */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; scroll-behavior: smooth; }

    body {
      font-family: var(--font-base);
      color: var(--color-text);
      background-color: #e8ddd0;
      min-height: 100vh;
    }

    a { color: var(--color-primary); text-decoration: none; }
    a:hover, a:focus-visible { text-decoration: underline; }
    img { display: block; max-width: 100%; height: auto; }
    ul { list-style: none; }

    /* =============================================
       Page Wrapper
    ============================================= */
    .page-wrapper {
      max-width: var(--max-w);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* =============================================
       Header
    ============================================= */
    /* =============================================
       Site Header — Style B 米色寬帶雙線金框
    ============================================= */
    .site-header {
      background: #fdf6e8;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px 28px;
      min-height: 96px;
      border-top: 4px solid #713917;
      border-bottom: 4px solid #713917;
      position: relative;
    }

    .site-header::before {
      content: '';
      position: absolute;
      top: 8px;
      left: 0;
      right: 0;
      height: 1px;
      background: #c9a96e;
    }

    .site-header::after {
      content: '';
      position: absolute;
      bottom: 8px;
      left: 0;
      right: 0;
      height: 1px;
      background: #c9a96e;
    }

    .header-inner {
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 4px;
      align-items: center;
    }

    .site-title-cn {
      font-size: 20px;
      font-weight: 700;
      color: #4e2610;
      letter-spacing: 0.15em;
      margin: 0;
    }

    .title-dot-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .title-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #b8860b;
    }

    .title-line {
      width: 40px;
      height: 0.5px;
      background: #b8860b;
    }

    .site-title-en {
      font-size: 10px;
      font-weight: 400;
      color: #8a6440;
      letter-spacing: 0.2em;
      margin: 0;
    }

    @media (max-width: 540px) {
      .site-title-cn { font-size: 18px; }
    }

    /* =============================================
       Content Grid (nav + main)
    ============================================= */
    .content-wrapper {
      flex: 1;
      display: grid;
      grid-template-columns: var(--nav-w) 1fr;
      grid-template-areas: "nav main";
      background-color: rgba(255,255,255,.84);
      }

    /* =============================================
       Side Navigation
    ============================================= */
        /* =============================================
       Side Navigation — Style B 金框印章按鈕
    ============================================= */
    .site-nav {
      grid-area: nav;
      padding: 0;
      border-right: 1px solid #d5b89a;
      background: #fdf6e8;
      display: flex;
      flex-direction: column;
      align-self: stretch;
    }

    .site-nav ul {
      padding: 1.25rem 0.75rem 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .site-nav li a {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 32px;
      padding: 0 0.5rem;
      font-size: 0.88rem;
      font-weight: 600;
      color: #713917;
      border: 1px solid #c9a96e;
      border-radius: 2px;
      letter-spacing: 0.05em;
      text-decoration: none;
      transition: background 0.18s, color 0.18s;
    }

    .site-nav li a:hover,
    .site-nav li a:focus-visible {
      background: #713917;
      color: #f5e6c8;
    }
    .site-nav::after {
      content: '';
      flex: 1;
      min-height: 20px;
      border-top: 0.5px solid rgba(201,169,110,.35);
      background-image:
        linear-gradient(45deg, rgba(184,134,11,.12) 25%, transparent 25%),
        linear-gradient(-45deg, rgba(184,134,11,.12) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, rgba(184,134,11,.12) 75%),
        linear-gradient(-45deg, transparent 75%, rgba(184,134,11,.12) 75%);
      background-size: 12px 12px;
      background-position: 0 0, 0 6px, 6px -6px, -6px 0;
    }
    .site-nav li a[aria-current="page"] { color: var(--color-primary); font-weight: 700; }
    .site-nav li a[aria-current="page"]:hover,
    .site-nav li a[aria-current="page"]:focus-visible { color: #f5e6c8; }

    /* =============================================
       Main Content
    ============================================= */
    .site-main {
      grid-area: main;
      padding: 0 1.25rem 1.5rem;
      min-width: 0;
    }

    /* =============================================
       Ticker（padding-left:100% 正確實作）
    ============================================= */
    .ticker-wrap {
      overflow: hidden;
      background-color: rgba(255,255,255,.55);
      border-bottom: 1px solid #ddd;
      padding: .3rem 0;
      margin-bottom: .9rem;
    }
    .ticker-track {
      display: inline-block;
      padding-left: 100%;
      white-space: nowrap;
      animation: ticker-scroll 22s linear infinite;
    }
    .ticker-track:hover { animation-play-state: paused; }
    .ticker-text { font-size: .88rem; color: var(--color-primary); }

    @keyframes ticker-scroll {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }

    /* =============================================
       Page Heading Bar
    ============================================= */
        /* =============================================
       Page Heading Bar — Style B 米色左棕框標籤
    ============================================= */
    .page-heading-bar {
      display: inline-flex;
      align-items: center;
      height: 32px;
      min-width: 120px;
      padding: 0 1rem;
      margin-bottom: 1.25rem;
      margin-top: .5rem;
      background: #fdf6e8;
      border: 1px solid #c9a96e;
      border-left: 3px solid #713917;
      border-radius: 0 2px 2px 0;
    }

    .page-heading-bar span {
      font-size: 0.95rem;
      font-weight: 700;
      color: #4e2610;
      letter-spacing: 0.06em;
    }

    /* =============================================
       News Section
    ============================================= */
    .news-section { margin-bottom: 1.5rem; }

    /* 子標題（新聞集錦）*/
    .subsection-title {
      display: flex;
      align-items: center;
      gap: .5rem;
      font-size: 1rem;
      font-weight: 700;
      color: var(--color-primary);
      margin-bottom: 1rem;
    }
    .subsection-title::before,
    .subsection-title::after {
      content: '';
      display: inline-block;
      width: 2px;
      height: 14px;
      background-color: var(--color-primary);
      border-radius: 1px;
      flex-shrink: 0;
    }

    /* 消息索引清單 */
    .news-index {
      display: flex;
      flex-direction: column;
      gap: .35rem;
      margin-bottom: 1.25rem;
      padding-left: .25rem;
    }
    .news-index li {
      display: flex;
      align-items: center;
      gap: .5rem;
    }
    .news-index li::before {
      content: '';
      display: inline-block;
      width: 10px;
      height: 10px;
      background-image: url('./image/imge/202.gif');
      background-repeat: no-repeat;
      background-size: contain;
      flex-shrink: 0;
    }
    .news-index a {
      font-size: .88rem;
      color: var(--color-primary);
    }
    .news-index a:hover { text-decoration: underline; }

    /* 分隔線 */
    .section-rule {
      border: none;
      border-top: 1px solid var(--color-primary);
      margin-bottom: 1.25rem;
    }

    /* 消息項目 */
    .news-list {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .news-item {
      display: flex;
      flex-direction: column;
      gap: .5rem;
    }

    .news-item-header {
      display: flex;
      align-items: baseline;
      gap: .75rem;
      flex-wrap: wrap;
    }

    .news-bullet {
      width: 14px;
      height: 16px;
      background-image: url('./image/imge/301.gif');
      background-repeat: no-repeat;
      background-size: contain;
      flex-shrink: 0;
      align-self: center;
    }

    .news-title {
      font-size: .95rem;
      font-weight: 700;
      color: var(--color-primary);
    }

    .news-date {
      font-size: .78rem;
      color: var(--color-text-light);
      letter-spacing: .03em;
    }

    .news-body {
      font-size: .88rem;
      line-height: 1.8;
      color: var(--color-text);
      padding-left: 1.35rem;
      border-left: 3px solid #e8d5b8;
    }
    .news-body a { color: var(--color-primary); text-decoration: underline; }
    .news-body a:hover { color: var(--color-primary-dk); }

    /* Back-to-top 純 CSS 取代裝飾圖 */
    .back-to-top {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      font-size: .78rem;
      color: var(--color-text-light);
      margin-top: .75rem;
      padding-left: 1.35rem;
      text-decoration: none;
    }
    .back-to-top:hover { color: var(--color-primary); text-decoration: underline; }
    .back-to-top::before {
      content: '▲';
      font-size: .65rem;
    }

    /* =============================================
       Footer
    ============================================= */
    .site-footer {
      background-color: rgba(255,255,255,.88);
      border-top: 1px solid #d5b89a;
      padding: .75rem 1rem .5rem;
    }
    .footer-inner { display: flex; flex-direction: column; align-items: center; gap: .4rem; }
    .footer-copy { font-size: .7rem; color: var(--color-text-light); letter-spacing: .04em; }
    .footer-deco {
      width: 570px;
      max-width: 100%;
      height: 8px;
      background-image: url('./image/imge/1-1.gif');
      background-repeat: no-repeat;
      background-position: center;
      background-size: 570px 8px;
    }

    /* =============================================
       漢堡抽屜 — 桌機預設（隱藏）
       在 ≤540px media 中啟用
    ============================================= */
    .nav-drawer-toggle,
    .nav-drawer-close { display: none; }

    /* 半透明遮罩：JS 加 .active 後顯示 */
    .nav-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .45);
      z-index: 199;
      cursor: pointer;
    }
    .nav-backdrop.active { display: block; }

        /* =============================================
       RWD — Tablet ( ≤ 768px )
    ============================================= */
    @media (max-width: 768px) {
      :root { --nav-w: 160px; }
      .site-nav { padding: .9rem .5rem .9rem .75rem; }
      .site-nav li a { font-size: .85rem; }
    }

    /* =============================================
       RWD — Mobile ( ≤ 540px ) — 漢堡抽屜版面
    ============================================= */
    @media (max-width: 540px) {

      /* 內容區：移除 nav 欄，主內容佔滿全寬 */
      .content-wrapper {
        grid-template-columns: 1fr;
        grid-template-areas: "main";
      }

      /* G2 漢堡按鈕 */
      .nav-drawer-toggle {
        display: flex;
        align-items: center;
        gap: 7px;
        position: absolute;
        right: .85rem;
        top: 50%;
        transform: translateY(-50%);
        height: 38px;
        padding: 0 10px 0 8px;
        background: #fdf6e8;
        border: 2px solid #713917;
        border-radius: 4px;
        cursor: pointer;
        z-index: 10;
      }
      .nav-drawer-toggle:hover,
      .nav-drawer-toggle:focus-visible { background: #f5ede3; }
      .tgl-icon { display: flex; flex-direction: column; gap: 5px; }
      .tgl-row  { display: flex; align-items: center; gap: 4px; }
      .tgl-dot  { width: 4px; height: 4px; border-radius: 50%; background: #b8860b; flex-shrink: 0; }
      .tgl-bar  { height: 2px; background: #713917; border-radius: 1px; }
      .tgl-divider { width: 1px; height: 22px; background: #c9a96e; }
      .tgl-label {
        font-size: 11px;
        font-weight: 700;
        color: #713917;
        letter-spacing: 0.08em;
        line-height: 1;
      }

      /* 關閉按鈕 */
      .nav-drawer-close {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        width: 100%;
        padding: .4rem .1rem .75rem;
        font-size: 1.2rem;
        color: var(--color-primary-dk);
        background: none;
        border: none;
        cursor: pointer;
      }
      .nav-drawer-close:hover,
      .nav-drawer-close:focus-visible { color: var(--color-primary); }

      /* Nav → fixed 左側抽屜 */
      .site-nav {
        position: fixed;
        top: 0; left: 0;
        width: 260px;
        height: 100%;
        overflow-y: auto;
        background: #fdf6e8;
        border-right: 2px solid #c9a96e;
        border-bottom: none;
        padding: .5rem .8rem 2.5rem;
        transform: translateX(-100%);
        transition: transform .25s ease;
        z-index: 200;
        box-shadow: 3px 0 18px rgba(0,0,0,.18);
        pointer-events: none;
      }
      .site-nav.drawer-open { transform: translateX(0); pointer-events: auto; }

      .site-nav ul {
        flex-direction: column;
        flex-wrap: nowrap;
        gap: 0;
        padding: 0 .25rem;
      }
      #site-nav li a {
        display: flex !important;
        align-items: center;
        height: auto !important;
        min-height: 44px;
        padding: .65rem .85rem !important;
        font-size: .92rem;
        font-weight: 600;
        color: var(--color-primary-dk) !important;
        background-color: transparent !important;
        border: none !important;
        border-radius: 0 !important;
        border-bottom: 1px solid #e2d0b8 !important;
        letter-spacing: .03em;
        text-decoration: none;
        cursor: pointer;
        touch-action: manipulation;
        -webkit-tap-highlight-color: rgba(113,57,23,.15);
      }
      #site-nav li a:hover,
      #site-nav li a:focus-visible {
        background-color: rgba(113,57,23,.08) !important;
        color: var(--color-primary) !important;
      }

      .site-main { padding: .75rem; }
      .footer-deco { background-size: 100% 8px; max-width: 100%; }
    }

    /* =============================================
       RWD — Small mobile ( ≤ 380px )
    ============================================= */
    @media (max-width: 380px) {
      .site-nav li a { height: 34px; }
      .news-body { font-size: .84rem; padding-left: .75rem; }
    }

    /* =============================================
       Accessibility
    ============================================= */
    @media (prefers-reduced-motion: reduce) {
      .ticker-track { animation: none; padding-left: .75rem; }
    }

    :focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }

    @media print {
      body { background: white; }
      .ticker-wrap { display: none; }
      .site-nav li a { background-image: none; border: 1px solid #ccc; }
    }
  </style>
</head>

<body>
  <div class="page-wrapper">

    <!-- ===== Header ===== -->

        <!-- 關閉按鈕：手機抽屜內顯示 -->

        <ul>

      <!-- Main Content -->

  <!-- 抽屜半透明遮罩 -->
  <div id="nav-backdrop" class="nav-backdrop" aria-hidden="true"></div>

  <script>
    /* ========================================
       漢堡抽屜 — 開關邏輯（手機版）
    ======================================== */
    (function() {
      var toggle   = document.getElementById('nav-drawer-toggle');
      var closeBtn = document.getElementById('nav-drawer-close');
      var drawer   = document.getElementById('site-nav');
      var backdrop = document.getElementById('nav-backdrop');
      if (!toggle || !drawer) return;

      function openDrawer() {
        drawer.classList.add('drawer-open');
        if (backdrop) backdrop.classList.add('active');
        toggle.setAttribute('aria-expanded', 'true');
      }

      function closeDrawer() {
        drawer.classList.remove('drawer-open');
        if (backdrop) backdrop.classList.remove('active');
        toggle.setAttribute('aria-expanded', 'false');
      }

      toggle.addEventListener('click', function() {
        if (drawer.classList.contains('drawer-open')) closeDrawer();
        else openDrawer();
      });

      if (closeBtn) closeBtn.addEventListener('click', closeDrawer);
      if (backdrop) backdrop.addEventListener('click', closeDrawer);

      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && drawer.classList.contains('drawer-open')) closeDrawer();
      });

      /* touchend 修正：overflow-y:auto 捲軸偵測會消費 touchstart，
         導致 click 不觸發。量測垂直位移 < 10px 視為 tap，直接跳頁。 */
      var _touchStartY = 0;
      drawer.addEventListener('touchstart', function(e) {
        _touchStartY = e.touches[0].clientY;
      }, { passive: true });

      drawer.addEventListener('touchend', function(e) {
        var link = e.target.closest('a[href]');
        if (!link) return;
        var dy = Math.abs(e.changedTouches[0].clientY - _touchStartY);
        if (dy < 10) {
          e.preventDefault();
          window.location.href = link.getAttribute('href');
        }
      });
    }());
  </script>
