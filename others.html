<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="利安貿易有限公司其他罐頭商品：韓國松茸罐頭、日本北寄貝罐頭、智利樂可思貝罐頭（Locos）、智利玉螺罐頭，產地嚴選，品質保證。">
  <title>其他罐頭商品 - 商品型錄 - 利安貿易有限公司 LY AN TRADE CO.,LTD.</title>

  <style>
    /* =============================================
       CSS 自訂變數
    ============================================= */
    :root {
      --color-primary:    #713917;
      --color-primary-dk: #4e2610;
      --color-gold:       #b8860b;
      --color-text:       #333333;
      --color-text-light: #666666;
      --color-white:      #ffffff;
      --color-bg-nav:     #f5ede3;
      --color-card-bg:    #f6f6f6;
      --color-card-img:   #cccccc;

      --font-base: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", Arial, sans-serif;

      --nav-w: 200px;
      --max-w: 900px;
      --gap:   1.25rem;
    }

    /* =============================================
       Reset & Base
    ============================================= */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; scroll-behavior: smooth; }

    body {
      font-family: var(--font-base);
      color: var(--color-text);
      background-color: #e8ddd0;
      min-height: 100vh;
    }

    a { color: var(--color-primary); text-decoration: none; }
    a:hover, a:focus-visible { text-decoration: underline; }
    img { display: block; max-width: 100%; height: auto; }
    ul { list-style: none; }

    /* =============================================
       Page Wrapper
    ============================================= */
    .page-wrapper {
      max-width: var(--max-w);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* =============================================
       Header
    ============================================= */
    /* =============================================
       Site Header — Style B 米色寬帶雙線金框
    ============================================= */
    .site-header {
      background: #fdf6e8;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px 28px;
      min-height: 96px;
      border-top: 4px solid #713917;
      border-bottom: 4px solid #713917;
      position: relative;
    }

    .site-header::before {
      content: '';
      position: absolute;
      top: 8px;
      left: 0;
      right: 0;
      height: 1px;
      background: #c9a96e;
    }

    .site-header::after {
      content: '';
      position: absolute;
      bottom: 8px;
      left: 0;
      right: 0;
      height: 1px;
      background: #c9a96e;
    }

    .header-inner {
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 4px;
      align-items: center;
    }

    .site-title-cn {
      font-size: 20px;
      font-weight: 700;
      color: #4e2610;
      letter-spacing: 0.15em;
      margin: 0;
    }

    .title-dot-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .title-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #b8860b;
    }

    .title-line {
      width: 40px;
      height: 0.5px;
      background: #b8860b;
    }

    .site-title-en {
      font-size: 10px;
      font-weight: 400;
      color: #8a6440;
      letter-spacing: 0.2em;
      margin: 0;
    }

    @media (max-width: 540px) {
      .site-title-cn { font-size: 18px; }
    }

    /* =============================================
       Content Grid (nav + main)
    ============================================= */
    .content-wrapper {
      flex: 1;
      display: grid;
      grid-template-columns: var(--nav-w) 1fr;
      grid-template-areas: "nav main";
      background-color: rgba(255,255,255,.84);
      }

    /* =============================================
       Side Navigation
    ============================================= */
        /* =============================================
       Side Navigation — Style B 金框印章按鈕
    ============================================= */
    .site-nav {
      grid-area: nav;
      padding: 0;
      border-right: 1px solid #d5b89a;
      background: #fdf6e8;
      display: flex;
      flex-direction: column;
      align-self: stretch;
    }

    .site-nav ul {
      padding: 1.25rem 0.75rem 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .site-nav li a {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 32px;
      padding: 0 0.5rem;
      font-size: 0.88rem;
      font-weight: 600;
      color: #713917;
      border: 1px solid #c9a96e;
      border-radius: 2px;
      letter-spacing: 0.05em;
      text-decoration: none;
      transition: background 0.18s, color 0.18s;
    }

    .site-nav li a:hover,
    .site-nav li a:focus-visible {
      background: #713917;
      color: #f5e6c8;
    }
    .site-nav::after {
      content: '';
      flex: 1;
      min-height: 20px;
      border-top: 0.5px solid rgba(201,169,110,.35);
      background-image:
        linear-gradient(45deg, rgba(184,134,11,.12) 25%, transparent 25%),
        linear-gradient(-45deg, rgba(184,134,11,.12) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, rgba(184,134,11,.12) 75%),
        linear-gradient(-45deg, transparent 75%, rgba(184,134,11,.12) 75%);
      background-size: 12px 12px;
      background-position: 0 0, 0 6px, 6px -6px, -6px 0;
    }
    .site-nav li a[aria-current="page"] { color: var(--color-primary); font-weight: 700; }
    .site-nav li a[aria-current="page"]:hover,
    .site-nav li a[aria-current="page"]:focus-visible { color: #f5e6c8; }

    /* =============================================
       Main Content
    ============================================= */
    .site-main {
      grid-area: main;
      padding: 0 1.25rem 1.5rem;
      min-width: 0;
    }

    /* =============================================
       Ticker（padding-left:100% 正確實作）
    ============================================= */
    .ticker-wrap {
      overflow: hidden;
      background-color: rgba(255,255,255,.55);
      border-bottom: 1px solid #ddd;
      padding: .3rem 0;
      margin-bottom: .9rem;
    }
    .ticker-track {
      display: inline-block;
      padding-left: 100%;
      white-space: nowrap;
      animation: ticker-scroll 22s linear infinite;
    }
    .ticker-track:hover { animation-play-state: paused; }
    .ticker-text { font-size: .88rem; color: var(--color-primary); }

    @keyframes ticker-scroll {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }

    /* =============================================
       Catalog Section Header
    ============================================= */
    .catalog-header {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: .75rem;
      margin-bottom: .9rem;
      padding-top: .5rem;
    }
        /* =============================================
       Section Heading Bar — Style B 米色左棕框標籤
    ============================================= */
    .section-heading-bar {
      display: inline-flex;
      align-items: center;
      height: 32px;
      min-width: 120px;
      padding: 0 1rem;
      margin-bottom: 1.1rem;
      background: #fdf6e8;
      border: 1px solid #c9a96e;
      border-left: 3px solid #713917;
      border-radius: 0 2px 2px 0;
    }

    .section-heading-bar span {
      font-size: 0.95rem;
      font-weight: 700;
      color: #4e2610;
      letter-spacing: 0.06em;
    }

    /* 分類導覽連結 */
    .catalog-nav { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; }
    .catalog-nav-label { font-size: .82rem; color: var(--color-text-light); white-space: nowrap; }
    .catalog-nav a {
      display: inline-flex; align-items: center;
      height: 28px; padding: 0 .7rem;
      font-size: .78rem; font-weight: 600;
      color: #713917;
      border: 1px solid #c9a96e;
      border-radius: 2px;
      text-decoration: none;
      letter-spacing: .04em;
      transition: background .15s, color .15s;
    }
    .catalog-nav a:hover,
    .catalog-nav a:focus-visible { background: #713917; color: #fdf6e8; text-decoration: none; }
    .catalog-nav a[aria-current="page"] { background: #713917; color: #fdf6e8; border-color: #4e2610; }

    /* 瀏覽提示列 */
    .catalog-hint {
      font-size: .84rem;
      color: var(--color-text-light);
      margin-bottom: .75rem;
    }
    .catalog-hint strong { color: var(--color-primary); }

    .section-rule { border: none; border-top: 1px solid var(--color-primary); margin-bottom: 1.1rem; }

    /* =============================================
       Product Grid（CSS Grid）
    ============================================= */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
    }

    /* =============================================
       Product Card — Style B 深棕頂欄
    ============================================= */
    .product-card {
      background: var(--color-white);
      border-radius: 4px;
      overflow: hidden;
      cursor: pointer;
      transition: box-shadow .2s, transform .15s;
      border: 1px solid #d5b89a;
      display: flex;
      flex-direction: column;
    }
    .product-card:hover,
    .product-card:focus-visible {
      box-shadow: 0 4px 14px rgba(113,57,23,.22);
      transform: translateY(-2px);
      outline: none;
    }

    /* 頂部深棕欄 */
    .card-header {
      background: #713917;
      padding: 7px 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }
    .card-header-dot {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: #c9a96e;
      flex-shrink: 0;
    }
    .card-name {
      font-size: .78rem;
      font-weight: 600;
      color: #fdf6e8;
      text-align: center;
      line-height: 1.4;
      letter-spacing: 0.06em;
    }

    /* 圖片區 */
    .card-img-wrap {
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: .75rem;
      aspect-ratio: 1 / 1;
      flex: 1;
    }
    .card-img-wrap img {
      width: 100%;
      max-width: 150px;
      height: auto;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border: none;
    }

    /* 底部金線 */
    .card-footer {
      height: 3px;
      background: linear-gradient(90deg, #c9a96e 0%, #b8860b 50%, #c9a96e 100%);
    }

    /* =============================================
       Modal
    ============================================= */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      z-index: 1000;
    }
    .modal-overlay[hidden] { display: none; }

    .modal-box {
      background: var(--color-white);
      border-radius: 8px;
      width: 100%;
      max-width: 560px;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .modal-close {
      position: absolute;
      top: .75rem;
      right: .75rem;
      width: 32px;
      height: 32px;
      border: 1px solid #ccc;
      border-radius: 50%;
      background: transparent;
      font-size: 1.2rem;
      line-height: 1;
      cursor: pointer;
      color: var(--color-text-light);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal-close:hover { background: #f0e8e0; color: var(--color-primary); }

    .modal-body {
      display: flex;
      gap: 1.25rem;
    }
    .modal-img-wrap {
      flex-shrink: 0;
      width: 130px;
      background: #ffffff;
      border: 1px solid #d5b89a;
      border-top: 3px solid #713917;
      border-radius: 2px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: .5rem;
    }
    .modal-img-wrap img {
      width: 100%;
      height: auto;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border: none;
    }
    .modal-info { flex: 1; min-width: 0; }
    .modal-name {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--color-primary);
      margin-bottom: .25rem;
    }
    .modal-en {
      font-size: .8rem;
      color: var(--color-text-light);
      margin-bottom: .4rem;
      font-style: italic;
    }
    .modal-unit {
      display: inline-block;
      font-size: .78rem;
      color: var(--color-gold);
      background: #fdf6e3;
      border: 1px solid #e8d5a3;
      border-radius: 3px;
      padding: .15rem .5rem;
      margin-bottom: .6rem;
    }
    .modal-rule { border: none; border-top: 1px solid #e0d0c0; margin-bottom: .75rem; }
    .modal-desc {
      font-size: .84rem;
      line-height: 1.75;
      color: var(--color-text);
      white-space: pre-wrap;
    }

    /* =============================================
       Footer
    ============================================= */
    .site-footer {
      background-color: rgba(255,255,255,.88);
      border-top: 1px solid #d5b89a;
      padding: .75rem 1rem .5rem;
    }
    .footer-inner { display: flex; flex-direction: column; align-items: center; gap: .4rem; }
    .footer-copy { font-size: .7rem; color: var(--color-text-light); letter-spacing: .04em; }
    .footer-deco {
      width: 570px;
      max-width: 100%;
      height: 8px;
      background-image: url('./image/imge/1-1.gif');
      background-repeat: no-repeat;
      background-position: center;
      background-size: 570px 8px;
    }

    /* =============================================
       RWD — Tablet ( ≤ 768px )
    ============================================= */
    @media (max-width: 768px) {
      :root { --nav-w: 160px; }
      .site-nav { padding: .9rem .5rem .9rem .75rem; }
      .site-nav li a { font-size: .85rem; }
      .product-grid { grid-template-columns: repeat(2, 1fr); }
    }

    /* =============================================
       RWD — Mobile ( ≤ 540px )
    ============================================= */
    @media (max-width: 540px) {
      .content-wrapper {
        grid-template-columns: 1fr;
        grid-template-areas: "nav" "main";
      }
      .site-nav {
        border-right: none;
        border-bottom: 1px solid #d5b89a;
        padding: .65rem .75rem;
      }
      .site-nav ul { flex-direction: row; flex-wrap: wrap; gap: .4rem; }
      .site-nav li a {
        height: 36px;
        padding: 0 .8rem;
        font-size: .82rem;
        background-image: none;
        background-color: var(--color-bg-nav);
        border: 1px solid var(--color-primary);
        border-radius: 4px;
      }
      .site-nav li a:hover, .site-nav li a:focus-visible {
        background-color: var(--color-primary);
        color: var(--color-white);
        transform: none;
        opacity: 1;
      }
      .site-main { padding: .75rem; }
      .section-heading-bar { width: 100%; justify-content: center; }
      .product-grid { grid-template-columns: repeat(2, 1fr); gap: .65rem; }
      .catalog-header { flex-direction: column; align-items: flex-start; }
      .modal-body { flex-direction: column; align-items: center; }
      .modal-img-wrap { width: 100%; max-width: 200px; }
      .footer-deco { background-size: 100% 8px; max-width: 100%; }
    }

    /* =============================================
       RWD — Small mobile ( ≤ 380px )
    ============================================= */
    @media (max-width: 380px) {
      .product-grid { grid-template-columns: 1fr; }
      .site-nav li a { font-size: .78rem; padding: 0 .6rem; height: 34px; }
    }

    /* =============================================
       Accessibility
    ============================================= */
    @media (prefers-reduced-motion: reduce) {
      .ticker-track { animation: none; padding-left: .75rem; }
      .product-card { transition: none; }
    }

    :focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }

    @media print {
      body { background: white; }
      .ticker-wrap, .modal-overlay { display: none; }
      .site-nav li a { background-image: none; border: 1px solid #ccc; }
    }
  </style>
</head>

       aria-labelledby="modal-name" hidden>

      <button class="modal-close" id="modal-close-btn" aria-label="關閉">&#x2715;</button>
      <div class="modal-body">
        <div class="modal-img-wrap">
          <img id="modal-img" src="" alt="" width="130" height="130">
        </div>
        <div class="modal-info">
          <h2 class="modal-name" id="modal-name"></h2>
          <p class="modal-en" id="modal-en"></p>
          <span class="modal-unit" id="modal-unit"></span>
          <hr class="modal-rule">
          <p class="modal-desc" id="modal-desc"></p>
        </div>
      </div>
    </div>

  <script>
    /* --- Category select navigation --- */
    /* 分類導覽改用 <a> 連結，無需 JavaScript */

    /* --- Product modal --- */
    const modal      = document.getElementById('product-modal');
    const modalClose = document.getElementById('modal-close-btn');
    let lastFocused  = null;

    function openModal(card) {
      lastFocused = card;
      document.getElementById('modal-img').src  = card.dataset.img;
      document.getElementById('modal-img').alt  = card.dataset.name;
      document.getElementById('modal-name').textContent = card.dataset.name;
      document.getElementById('modal-en').textContent   = card.dataset.en;
      document.getElementById('modal-unit').textContent = card.dataset.unit;
      document.getElementById('modal-desc').textContent = card.dataset.desc;
      modal.hidden = false;
      modalClose.focus();
    }

    function closeModal() {
      modal.hidden = true;
      if (lastFocused) lastFocused.focus();
    }

    /* Click on card */
    document.querySelectorAll('.product-card').forEach(function (card) {
      card.addEventListener('click', function () { openModal(card); });
      card.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openModal(card); }
      });
    });

    /* Close button */
    modalClose.addEventListener('click', closeModal);

    /* Click backdrop */
    modal.addEventListener('click', function (e) {
      if (e.target === modal) closeModal();
    });

    /* Escape key */
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && !modal.hidden) closeModal();
    });
  </script>
