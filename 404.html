<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="canonical" href="https://www.lyan.com.tw/">
  <title>找不到頁面 - 利安貿易有限公司</title>

  <style>
    :root {
      --color-primary:    #713917;
      --color-primary-dk: #4e2610;
      --color-gold:       #b8860b;
      --color-text:       #333333;
      --color-text-light: #666666;
      --color-white:      #ffffff;
      --font-base: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", Arial, sans-serif;
      --nav-w:  200px;
      --max-w:  900px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { font-size: 16px; }

    body {
      font-family: var(--font-base);
      color: var(--color-text);
      background-color: #e8ddd0;
      min-height: 100vh;
    }

    a { color: inherit; text-decoration: none; }
    ul { list-style: none; }

    .page-wrapper {
      max-width: var(--max-w);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ── Header ── */
    .site-header {
      background: #fdf6e8;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px 28px;
      min-height: 96px;
      border-top: 4px solid #713917;
      border-bottom: 4px solid #713917;
      position: relative;
    }
    .site-header::before {
      content: ''; position: absolute; top: 8px; left: 0; right: 0;
      height: 1px; background: #c9a96e;
    }
    .site-header::after {
      content: ''; position: absolute; bottom: 8px; left: 0; right: 0;
      height: 1px; background: #c9a96e;
    }
    .header-inner {
      text-align: center; display: flex; flex-direction: column;
      gap: 4px; align-items: center;
    }
    .site-title-cn { font-size: 20px; font-weight: 700; color: #4e2610; letter-spacing: 0.15em; }
    .title-dot-row  { display: flex; gap: 6px; align-items: center; }
    .title-dot      { width: 4px; height: 4px; border-radius: 50%; background: #b8860b; }
    .title-line     { width: 40px; height: 0.5px; background: #b8860b; }
    .site-title-en  { font-size: 10px; color: #8a6440; letter-spacing: 0.2em; }

    /* ── Content ── */
    .content-wrapper {
      flex: 1;
      display: grid;
      grid-template-columns: var(--nav-w) 1fr;
      grid-template-areas: "nav main";
      background-color: rgba(255,255,255,.84);
    }

    /* ── Nav ── */
    .site-nav {
      grid-area: nav;
      padding: 0;
      border-right: 1px solid #d5b89a;
      background: #fdf6e8;
      display: flex; flex-direction: column; align-self: stretch;
    }
    .site-nav ul {
      padding: 1.25rem 0.75rem 0.75rem;
      display: flex; flex-direction: column; gap: 0.5rem;
    }
    .site-nav li a {
      display: flex; align-items: center; justify-content: center;
      height: 32px; padding: 0 0.5rem;
      font-size: 0.88rem; font-weight: 600; color: #713917;
      border: 1px solid #c9a96e; border-radius: 2px;
      letter-spacing: 0.05em;
      transition: background 0.18s, color 0.18s;
    }
    .site-nav li a:hover,
    .site-nav li a:focus-visible { background: #713917; color: #f5e6c8; }
    .site-nav::after {
      content: ''; flex: 1; min-height: 20px;
      border-top: 0.5px solid rgba(201,169,110,.35);
      background-image:
        linear-gradient(45deg, rgba(184,134,11,.12) 25%, transparent 25%),
        linear-gradient(-45deg, rgba(184,134,11,.12) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, rgba(184,134,11,.12) 75%),
        linear-gradient(-45deg, transparent 75%, rgba(184,134,11,.12) 75%);
      background-size: 12px 12px;
      background-position: 0 0, 0 6px, 6px -6px, -6px 0;
    }

    /* ── Main：404 內容 ── */
    .site-main {
      grid-area: main;
      padding: 3rem 1.25rem 2rem;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; gap: 1rem;
    }

    .error-code {
      font-size: 5rem; font-weight: 700;
      color: #d5b89a; letter-spacing: 0.1em;
      line-height: 1;
    }

    .error-title {
      font-size: 1.2rem; font-weight: 700;
      color: var(--color-primary-dk);
    }

    .error-desc {
      font-size: 0.9rem; color: var(--color-text-light);
      line-height: 1.8; max-width: 320px;
    }

    .error-divider {
      width: 60px; height: 1px;
      background: linear-gradient(90deg, transparent, #c9a96e, transparent);
    }

    .btn-home {
      display: inline-flex; align-items: center; justify-content: center;
      margin-top: .5rem;
      padding: 0.55rem 1.6rem;
      font-size: 0.9rem; font-weight: 600;
      color: #fdf6e8; background: #713917;
      border: none; border-radius: 2px;
      cursor: pointer; letter-spacing: 0.08em;
      transition: background 0.18s;
      text-decoration: none;
    }
    .btn-home:hover { background: #4e2610; }

    /* ── Footer ── */
    .site-footer {
      background: #fdf6e8;
      border-top: 1px solid #d5b89a;
      padding: 0.75rem 1rem;
      text-align: center;
    }
    .footer-copy { font-size: 0.75rem; color: #8a6440; }
    .footer-deco {
      margin: 0.4rem auto 0; height: 8px; max-width: 570px;
      background-image: url('./image/imge/1-1.gif');
      background-repeat: no-repeat; background-position: center;
      background-size: 570px 8px;
    }

    /* ── 漢堡 ── */
    .nav-drawer-toggle, .nav-drawer-close { display: none; }
    .nav-backdrop {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.45); z-index: 199; cursor: pointer;
    }
    .nav-backdrop.active { display: block; }

    @media (max-width: 768px) {
      :root { --nav-w: 160px; }
    }

    @media (max-width: 540px) {
      .content-wrapper { grid-template-columns: 1fr; grid-template-areas: "main"; }
      .site-header { padding-right: 60px; }
      .nav-drawer-toggle {
        display: flex; flex-direction: column; align-items: center; gap: 5px;
        position: absolute; right: .85rem; top: 50%; transform: translateY(-50%);
        width: 46px; padding: 7px 8px 6px;
        background: #fdf6e8; border: 2px solid #713917; border-radius: 4px;
        cursor: pointer; z-index: 10;
      }
      .nav-drawer-toggle:hover { background: #f5ede3; }
      .tgl-icon { display: flex; flex-direction: column; gap: 5px; }
      .tgl-row  { display: flex; align-items: center; gap: 4px; }
      .tgl-dot  { width: 4px; height: 4px; border-radius: 50%; background: #b8860b; flex-shrink: 0; }
      .tgl-bar  { height: 2px; background: #713917; border-radius: 1px; }
      .tgl-label { font-size: 10px; font-weight: 700; color: #713917; letter-spacing: 0.08em; }
      .nav-drawer-close {
        display: flex; align-items: center; justify-content: flex-end;
        width: 100%; padding: .4rem .1rem .75rem;
        font-size: 1.2rem; color: #4e2610;
        background: none; border: none; cursor: pointer;
      }
      .site-nav {
        position: fixed; top: 0; left: 0;
        width: 260px; height: 100%; overflow-y: auto;
        background: #fdf6e8; border-right: 2px solid #c9a96e;
        padding: .5rem .8rem 2.5rem;
        transform: translateX(-100%); transition: transform .25s ease;
        z-index: 200; box-shadow: 3px 0 18px rgba(0,0,0,.18);
        pointer-events: none;
      }
      .site-nav.drawer-open { transform: translateX(0); pointer-events: auto; }
      .site-nav ul { flex-direction: column; flex-wrap: nowrap; gap: 0; padding: 0 .25rem; }
      #site-nav li a {
        display: flex !important; align-items: center;
        height: auto !important; min-height: 44px;
        padding: .65rem .85rem !important;
        font-size: .92rem; font-weight: 600; color: #4e2610 !important;
        background: transparent !important; border: none !important;
        border-bottom: 1px solid #e2d0b8 !important;
        touch-action: manipulation;
      }
      .site-main { padding: 2rem .75rem; }
      .error-code { font-size: 3.5rem; }
    }
  </style>
</head>

<body>
  <div class="page-wrapper">

    <header class="site-header">
      <div class="header-inner">
        <h1 class="site-title-cn">利安貿易有限公司</h1>
        <div class="title-dot-row">
          <div class="title-line"></div>
          <div class="title-dot"></div>
          <div class="title-dot"></div>
          <div class="title-dot"></div>
          <div class="title-line"></div>
        </div>
        <p class="site-title-en">LY AN TRADE CO., LTD.</p>
      </div>
      <button id="nav-drawer-toggle" class="nav-drawer-toggle"
              aria-label="開啟選單" aria-expanded="false" aria-controls="site-nav">
        <div class="tgl-icon">
          <div class="tgl-row"><div class="tgl-dot"></div><div class="tgl-bar" style="width:18px;"></div></div>
          <div class="tgl-row"><div class="tgl-dot"></div><div class="tgl-bar" style="width:13px;"></div></div>
          <div class="tgl-row"><div class="tgl-dot"></div><div class="tgl-bar" style="width:18px;"></div></div>
        </div>
        <span class="tgl-label">選單</span>
      </button>
    </header>

    <div class="content-wrapper">

      <nav class="site-nav" id="site-nav" aria-label="主選單">
        <button class="nav-drawer-close" id="nav-drawer-close" aria-label="關閉選單">&#x2715;</button>
        <ul>
          <li><a href="./index.html">首頁</a></li>
          <li><a href="./introduction.html">公司簡介</a></li>
          <li><a href="./whatsnew.html">最新消息</a></li>
          <li><a href="./catalog.html">商品型錄</a></li>
          <li><a href="./branch.html">客戶服務</a></li>
          <li><a href="./addressbook.html">聯絡資訊</a></li>
        </ul>
      </nav>

      <main class="site-main">
        <p class="error-code">404</p>
        <div class="error-divider"></div>
        <p class="error-title">找不到您要的頁面</p>
        <p class="error-desc">頁面可能已移除或網址輸入有誤，<br>請回首頁繼續瀏覽。</p>
        <a href="./index.html" class="btn-home">回到首頁</a>
      </main>

    </div>

    <footer class="site-footer">
      <div class="footer-copy">LY AN TRADE CO., LTD. &copy; All Rights Reserved</div>
      <div class="footer-deco" role="presentation" aria-hidden="true"></div>
    </footer>

  </div>

  <div id="nav-backdrop" class="nav-backdrop" aria-hidden="true"></div>

  <script>
    (function() {
      var toggle   = document.getElementById('nav-drawer-toggle');
      var closeBtn = document.getElementById('nav-drawer-close');
      var drawer   = document.getElementById('site-nav');
      var backdrop = document.getElementById('nav-backdrop');
      if (!toggle || !drawer) return;
      function openDrawer()  { drawer.classList.add('drawer-open'); if (backdrop) backdrop.classList.add('active'); toggle.setAttribute('aria-expanded','true'); }
      function closeDrawer() { drawer.classList.remove('drawer-open'); if (backdrop) backdrop.classList.remove('active'); toggle.setAttribute('aria-expanded','false'); }
      toggle.addEventListener('click', function() { drawer.classList.contains('drawer-open') ? closeDrawer() : openDrawer(); });
      if (closeBtn) closeBtn.addEventListener('click', closeDrawer);
      if (backdrop) backdrop.addEventListener('click', closeDrawer);
      document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeDrawer(); });
    })();
  </script>

</body>
</html>
